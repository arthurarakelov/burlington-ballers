<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Burlington Ballers logo</title>
  <desc id="desc">A basketball club badge with BB lettering.</desc>
  <defs>
    <linearGradient id="badgeBg" x1="94" y1="56" x2="421" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21362f"/>
